        :root {
            --bg-page: #0f172a;

            padding: 0;
        }

        }

        .badge {

            padding: 2px 8px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.95em;
        }

        .molecule-grid {

            justify-content: center;
            align-items: center;

            padding: 16px;

            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.25);
        }

        .mol-label {
            color: #475569;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }

        .vs-divider {

            font-weight: 800;

            background: #0f172a;
            border: 1px solid var(--border-subtle);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-track {
            width: 100%;
            height: 8px;
            background: #0f172a;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 20px;
            border: 1px solid var(--border-subtle);
        }

        .timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
        }

            color: #0f172a;
            border: none;
            border-radius: 10px;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
            margin: 6px;
        }

            background: #7dd3fc;
            transform: translateY(-1px);
        }
