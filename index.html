<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stereoisomer Discrimination Task</title>
    
    <!-- jsPsych CSS -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <!-- jsPsych Plugins -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.4"></script>

    <style>
        .molecule-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 20px 0;
        }
        .chem-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .timer-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: #3b82f6;
            width: 100%;
            transition: width linear;
        }
        .instruction-box {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<script>
    // ----------------------------------------------------
    // 1. RETAKE GUARD & EMAIL HASHING UTILITIES
    // ----------------------------------------------------
    const STORAGE_KEY = 'stereomer_test_completed_v1';
    
    if (localStorage.getItem(STORAGE_KEY) === 'true') {
        document.body.innerHTML = `
            <div style="font-family: sans-serif; text-align: center; margin-top: 100px; padding: 20px;">
                <h2 style="color: #e11d48;">Study Already Completed</h2>
                <p>Our records indicate you have already finished this test on this browser device.</p>
                <p style="color: #64748b; font-size: 0.9em;">Thank you for your participation!</p>
            </div>
        `;
        throw new Error('Study already completed.');
    }

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ----------------------------------------------------
    // 2. MOLECULAR SVG TEMPLATES (Chiral Wedge/Dash Models)
    // ----------------------------------------------------
    // Standard Tetrahedral representation (Central Carbon C, with Br, Cl, F, H substituents)
    const molIdenticalSVG = `
        <svg width="180" height="180" viewBox="0 0 200 200">
            <!-- Bonds -->
            <line x1="100" y1="100" x2="100" y2="35" stroke="#1e293b" stroke-width="4" />
            <line x1="100" y1="100" x2="35" y2="140" stroke="#1e293b" stroke-width="4" />
            <!-- Wedge Bond (Br - pointing forward) -->
            <polygon points="100,100 155,155 165,145" fill="#1e293b" />
            <!-- Dash Bond (H - pointing backward represented by striped lines) -->
            <line x1="100" y1="100" x2="150" y2="50" stroke="#1e293b" stroke-width="4" stroke-dasharray="5,5" />
            <!-- Atoms -->
            <circle cx="100" cy="100" r="14" fill="#0f172a" />
            <text x="100" y="105" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">C</text>
            <text x="100" y="25" fill="#ef4444" font-size="16" font-weight="bold" text-anchor="middle">Cl</text>
            <text x="20" y="155" fill="#3b82f6" font-size="16" font-weight="bold" text-anchor="middle">F</text>
            <text x="180" y="165" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">Br</text>
            <text x="160" y="45" fill="#64748b" font-size="16" font-weight="bold" text-anchor="middle">H</text>
        </svg>
    `;

    // Rotated/Enantiomer Stereoisomer SVG
    const molStereomerSVG = `
        <svg width="180" height="180" viewBox="0 0 200 200">
            <!-- Bonds (Inverted positions) -->
            <line x1="100" y1="100" x2="100" y2="35" stroke="#1e293b" stroke-width="4" />
            <line x1="100" y1="100" x2="35" y2="140" stroke="#1e293b" stroke-width="4" />
            <!-- Inverted Wedge & Dash -->
            <line x1="100" y1="100" x2="150" y2="50" stroke="#1e293b" stroke-width="4" stroke-dasharray="5,5" />
            <polygon points="100,100 155,155 165,145" fill="#1e293b" />
            <!-- Atoms -->
            <circle cx="100" cy="100" r="14" fill="#0f172a" />
            <text x="100" y="105" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">C</text>
            <text x="100" y="25" fill="#ef4444" font-size="16" font-weight="bold" text-anchor="middle">Cl</text>
            <text x="20" y="155" fill="#3b82f6" font-size="16" font-weight="bold" text-anchor="middle">F</text>
            <text x="180" y="165" fill="#64748b" font-size="16" font-weight="bold" text-anchor="middle">H</text>
            <text x="160" y="45" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">Br</text>
        </svg>
    `;

    // ----------------------------------------------------
    // 3. TRIAL DEFINITIONS
    // ----------------------------------------------------
    const trialsData = [
        { id: 1, left: molIdenticalSVG, right: molIdenticalSVG, answer: 'identical', correct_key: 'i' },
        { id: 2, left: molIdenticalSVG, right: molStereomerSVG, answer: 'stereomer', correct_key: 's' },
        { id: 3, left: molStereomerSVG, right: molStereomerSVG, answer: 'identical', correct_key: 'i' },
        { id: 4, left: molIdenticalSVG, right: molStereomerSVG, answer: 'stereomer', correct_key: 's' }
    ];

    // ----------------------------------------------------
    // 4. INITIATE JSPYCH & DATAPIPE
    // ----------------------------------------------------
    const jsPsych = initJsPsych({
        on_finish: function() {
            // Lock browser so they can't retake
            localStorage.setItem(STORAGE_KEY, 'true');
            
            // Show completion message
            document.body.innerHTML = `
                <div style="font-family: sans-serif; text-align: center; margin-top: 100px; padding: 20px;">
                    <h2 style="color: #16a34a;">Experiment Completed!</h2>
                    <p>Thank you for participating. Your response data has been successfully recorded.</p>
                    <p style="color: #64748b; font-size: 0.85em;">You may now close this tab.</p>
                </div>
            `;
        }
    });

    let timeline = [];

    // Fullscreen toggle
    timeline.push({
        type: jsPsychFullscreen,
        fullscreen_mode: true
    });

    // Email Input & GDPR Consent Trial
    let participantHash = 'anonymous';
    timeline.push({
        type: jsPsychSurveyText,
        questions: [
            {prompt: 'Enter your student email address (used only to match pre/post sessions or check duplicates):', name: 'email', required: true}
        ],
        button_label: 'Start Experiment',
        on_finish: async function(data) {
            const rawEmail = data.response.email.trim().toLowerCase();
            participantHash = await sha256(rawEmail);
            jsPsych.data.addProperties({ participant_hash: participantHash });
        }
    });

    // Instructions Trial
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div class="instruction-box">
                <h2>Stereoisomer Discrimination Task</h2>
                <p>You will be presented with pairs of 3D molecular structures.</p>
                <p>Your task is to determine whether the two molecules are <b>IDENTICAL</b> (can be rotated to match) or <b>STEREOISOMERS</b> (non-superimposable mirror images / enantiomers).</p>
                <ul>
                    <li>Press <b>[ I ]</b> if they are <b>Identical</b></li>
                    <li>Press <b>[ S ]</b> if they are a <b>Stereoisomer</b></li>
                </ul>
                <p>You have <b>5 seconds</b> per pair. Accuracy and reaction time are both recorded.</p>
                <p style="text-align: center; margin-top: 30px;"><b style="color: #2563eb;">Press any key to begin.</b></p>
            </div>
        `
    });

    // Generate Experimental Trials dynamically
    trialsData.forEach((trial) => {
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div>
                    <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 5px;">Trial ${trial.id} of ${trialsData.length}</p>
                    <div class="molecule-box">
                        <div class="chem-card">${trial.left}</div>
                        <div style="font-size: 24px; font-weight: bold; color: #cbd5e1;">VS</div>
                        <div class="chem-card">${trial.right}</div>
                    </div>
                    <p style="margin-top: 25px; font-size: 1.1rem;">
                        Are these molecules identical or stereoisomers?<br/>
                        <span style="font-size: 0.9rem; color: #475569;">Press <b>[I]</b> for Identical | Press <b>[S]</b> for Stereoisomer</span>
                    </p>
                    <div class="timer-bar"><div class="timer-fill" id="dynamic-timer"></div></div>
                </div>
            `,
            choices: ['i', 's'],
            trial_duration: 5000, // 5 seconds hard time limit
            data: {
                task: 'stereoisomer_trial',
                trial_index: trial.id,
                correct_answer: trial.answer
            },
            on_load: function() {
                // Smooth countdown animation bar
                const fill = document.getElementById('dynamic-timer');
                if (fill) {
                    fill.style.transition = 'width 5000s linear'; // fallback
                    fill.style.transition = 'width 5000ms linear';
                    setTimeout(() => { fill.style.width = '0%'; }, 50);
                }
            },
            on_finish: function(data) {
                // Evaluate accuracy
                if (data.response === null) {
                    data.accuracy = false;
                    data.timeout = true;
                } else {
                    data.timeout = false;
                    data.accuracy = (data.response === trial.correct_key);
                }
            }
        });
    });

    // ----------------------------------------------------
    // 5. DATAPIPE EXPORT TRIAL (Works before & after setup)
    // ----------------------------------------------------
    const EXPERIMENT_ID = 'YOUR_DATAPIPE_EXPERIMENT_ID_HERE';

    if (EXPERIMENT_ID !== 'YOUR_DATAPIPE_EXPERIMENT_ID_HERE') {
        timeline.push({
            type: jsPsychPipe,
            action: "save",
            experiment_id: EXPERIMENT_ID,
            filename: () => `stereomer_data_${Date.now()}.csv`,
            data_string: () => jsPsych.data.get().csv()
        });
    }

    // Run the experiment
    jsPsych.run(timeline);
</script>
</body>
</html>
